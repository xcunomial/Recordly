name: CI

on:
  pull_request:
  push:
    branches: ["develop", "master"]
  workflow_dispatch:
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci --ignore-scripts

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Check formatting (advisory)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run format:check

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      # Main currently has known locale-parity debt covered by PR #710. Keep the
      # check visible without blocking unrelated PRs; make it required once that
      # existing translation PR (or an equivalent fix) lands.
      - name: Check translations (advisory)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run i18n:check

  ci-required:
    name: CI required
    if: ${{ always() }}
    needs: ["quality"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every validation result
        env:
          REQUIRED_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          python3 - <<'PY'
          import os
          states = os.environ.get('REQUIRED_RESULTS', '').split(',')
          if any(state.strip() != 'success' for state in states):
              raise SystemExit('Every required validation must succeed: ' + repr(states))
          print(f'All {len(states)} required validation jobs succeeded.')
          PY

